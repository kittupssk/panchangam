<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#12111d;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Daily Hora Chart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&display=swap">
<style>
/* Layout: a single instrument column — inputs, the day's panchangam, a 24-segment day/night band, then the two hora tables */
:root {
  --bg: #12111d;
  --surface: #1b1a2a;
  --ink: #ecebf5;
  --muted: #9c9ab0;
  --line: #2d2c42;
  --accent: #f0a04b;      /* turmeric */
  --accent-soft: #3a2a17;
  --warn: #ff9a85;
  --warn-soft: #3d1f1a;
  --day: #c9963a;
  --day-ink: #2a1c02;
  --night: #4a4890;
  --night-ink: #e6e4ff;
  --now: #f0a04b;
  --flash: #5a3f1c;
  --good: #2fb35f;
  --good-soft: #123a24;
  --font-display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --font-te: "Noto Sans Telugu", "Nirmala UI", "Gautami", sans-serif;
  color-scheme: dark; /* always dark, whatever the device theme */
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.wrap > * { min-width: 0; }

header h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.1; margin: 0; text-wrap: balance;
}
header p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px; display: grid; gap: 14px;
}
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } .field.wide { grid-column: 1 / -1; } }
.field select {
  font: 500 1rem var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0;
}
.field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.offset-row { display: flex; gap: 8px; min-width: 0; }
.offset-row input { flex: 1 1 4.5rem; }
.offset-row button { flex: 0 0 auto; padding: 8px 10px; }
.offset-row button:disabled { opacity: 0.45; cursor: default; background: transparent; border-color: var(--line); color: var(--muted); }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field label, .eyebrow {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.field input {
  font: 500 1rem var(--font-mono); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0;
}
.field input.edited, .field input.pending { border-color: var(--accent); }
.field input:focus-visible, button:focus-visible, .check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field small { color: var(--muted); font-size: 0.78rem; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.vara { font-size: 0.95rem; }
.vara b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: 600 0.88rem var(--font-body); cursor: pointer; border-radius: 6px; padding: 8px 14px;
  border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink);
}
button:hover { background: var(--accent); color: var(--surface); }
button.ghost { background: transparent; border-color: var(--line); }
button.ghost:hover { border-color: var(--accent); background: transparent; color: var(--ink); }

/* Panchangam */
.panch { padding: 0; gap: 0; }
.panch-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 16px 18px 10px; }
.panch-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.panch-head span { font: 0.82rem var(--font-mono); color: var(--muted); }
.prow { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: start; }
@media (max-width: 520px) { .prow { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.prow .eyebrow { padding-top: 3px; }
.prow .eyebrow .te { display: block; font: 500 0.9rem var(--font-te); letter-spacing: 0; text-transform: none; color: var(--muted); }
.items { display: grid; gap: 6px; min-width: 0; }
.item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.item .name { font-weight: 600; }
.item .te { font-family: var(--font-te); color: var(--muted); }
.item .when { font: 500 0.95rem var(--font-mono); font-variant-numeric: tabular-nums; }
.plus { color: var(--accent); font-weight: 700; font-size: 0.85em; white-space: nowrap; }
.chip { font: 700 0.65rem var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; }
.chip.avoid { background: var(--warn-soft); color: var(--warn); }
.chip.live { background: var(--accent-soft); color: var(--accent); }
.empty { color: var(--muted); }
.panch-foot { padding: 10px 18px 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.88rem; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.now-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 14px 18px; }
.now-card .big-glyph { grid-row: span 2; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 600 1.15rem var(--font-te), var(--font-body); background: var(--surface); border: 1px solid var(--accent); }
.now-card .lbl { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.now-card .main { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; }
.now-card .main .when { font: 500 0.95rem var(--font-mono); color: var(--ink); white-space: nowrap; }
.now-card .sub { grid-column: 1 / -1; color: var(--muted); font-size: 0.88rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.now-card .sub b { color: var(--ink); font-weight: 600; }
.now-card .warn { color: var(--warn); font-weight: 600; }
.now-card.flash { animation: cardflash 1.6s ease-out; }
@keyframes cardflash { 0%, 30% { background: var(--flash); } 100% { background: var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .now-card.flash { animation: none; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
@media (max-width: 680px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); padding: 12px 14px; min-width: 0; }
.stat span { display: block; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat b { font: 500 1.05rem var(--font-mono); font-variant-numeric: tabular-nums; }
.stat.now b { color: var(--accent); }

.band { --band-h: 34px; display: flex; height: var(--band-h); border-radius: 6px; overflow: hidden; position: relative; border: 1px solid var(--line); }
.band div { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 600 0.72rem var(--font-te), var(--font-body); overflow: hidden; border-right: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); }
.band .d { background: var(--day); color: var(--day-ink); }
.band .n { background: var(--night); color: var(--night-ink); }

.band-legend { display: flex; justify-content: space-between; font: 0.75rem var(--font-mono); color: var(--muted); margin-top: 4px; }

section h2 {
  font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0 0 8px;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
section h2 small { font: 0.85rem var(--font-mono); color: var(--muted); }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.n { color: var(--muted); font: 0.85rem var(--font-mono); width: 2.5em; }
td.t { font: 500 1rem var(--font-mono); }
td.t .s { color: var(--muted); font-size: 0.8em; }
.lord { display: inline-flex; align-items: center; gap: 9px; }
/* hora lord short label */
.glyph {
  font-family: var(--font-te), var(--font-body); font-weight: 600;
  width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 12px; line-height: 1; background: var(--bg); border: 1px solid var(--line);
}
.lord b { font-weight: 600; }
.lord em { font-style: normal; color: var(--muted); font-size: 0.85rem; }
tr.cur td { background: var(--accent-soft); }
tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--now); }
tr.cur.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--flash); } 100% { background: var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { tr.cur.flash td { animation: none; } }
.tag { font: 700 0.65rem var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-left: 8px; }

.note { color: var(--muted); font-size: 0.85rem; max-width: 72ch; display: grid; gap: 8px; }
.note p { margin: 0; }
.note code { font-family: var(--font-mono); font-size: 0.9em; }
.err { color: var(--warn); font-weight: 600; }
@media (max-width: 520px) {
  th, td { padding: 8px 6px; }
  th:first-child, td.n { display: none; }
  tr.cur td.n + td { box-shadow: inset 3px 0 0 var(--now); }
  .lord em { display: none; }
  .lord { gap: 6px; }
  .glyph { width: 24px; height: 24px; font-size: 11px; }
  td.t { font-size: 0.86rem; }
  .band div { font-size: 0.56rem; letter-spacing: -0.02em; }
  html[lang="te"] .band div { font-size: 0.66rem; }
}
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang {
  font: 600 0.9rem var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; flex: 0 0 auto;
}
.lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
html[lang="te"] body { font-family: var(--font-te), var(--font-body); }
html[lang="te"] h1, html[lang="te"] h2, html[lang="te"] .now-card .main, html[lang="te"] .vara b { font-family: var(--font-te), var(--font-display); font-weight: 500; }
html[lang="te"] .field label, html[lang="te"] .eyebrow, html[lang="te"] th, html[lang="te"] .stat span,
html[lang="te"] .now-card .lbl, html[lang="te"] .tag, html[lang="te"] .chip { letter-spacing: 0; text-transform: none; font-size: 0.82rem; }
.note p { line-height: 1.7; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--warn-soft); color: var(--warn); }
.now-card .effect { grid-column: 1 / -1; font-size: 0.9rem; line-height: 1.6; border-top: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding-top: 8px; margin-top: 4px; }
.tara-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 18px 12px; }
.tara-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; }
html[lang="te"] .tara-head h2 { font-family: var(--font-te), var(--font-display); font-weight: 500; }
.tara-pick { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tara-pick select { font: 500 0.95rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; max-width: 100%; }
html[lang="te"] .tara-pick select { font-family: var(--font-te), var(--font-body); }
.tara-pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tara-item { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; gap: 5px; }
.tara-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tara-top .when { font: 500 0.92rem var(--font-mono); }
.tara-top .arrow { color: var(--muted); }
.fx { color: var(--muted); font-size: 0.9rem; line-height: 1.65; }
.meta { color: var(--muted); font-size: 0.8rem; }
.hint { padding: 0 18px 16px; color: var(--muted); font-size: 0.9rem; }
details.ref { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.ref summary { cursor: pointer; padding: 14px 18px; font-family: var(--font-display); font-size: 1.15rem; list-style-position: inside; }
html[lang="te"] details.ref summary { font-family: var(--font-te), var(--font-display); font-weight: 500; }
details.ref summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ref-body { padding: 0 18px 16px; display: grid; gap: 10px; font-size: 0.92rem; line-height: 1.7; }
.ref-body p { margin: 0; }
.ref-body .muted { color: var(--muted); }
.ref-body b { color: var(--accent); font-weight: 600; }
.days { display: grid; }
.day { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.day.today { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.day-head b { font-size: 1.02rem; }
.day-head .sun { color: var(--muted); font: 0.85rem var(--font-mono); }
.day-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 2px 10px; font-size: 0.92rem; }
.day-row .k { color: var(--muted); font-size: 0.82rem; padding-top: 2px; }
.day-row .v { display: grid; gap: 2px; min-width: 0; }
.day-row .when { font: 500 0.9rem var(--font-mono); }
@media (max-width: 520px) { .day-row { grid-template-columns: 6.2rem minmax(0, 1fr); } }
/* Good (Guru, Sukra) and bad (Sani, Kuja) horas */
tr.good td.t { color: var(--good); }
tr.bad td.t { color: var(--warn); }
tr.good td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.cur td:first-child { box-shadow: inset 3px 0 0 var(--now); }
tr.good .glyph { background: var(--good-soft); border-color: var(--good); color: var(--good); }
tr.bad .glyph { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.lord .chip { margin-left: 2px; font-size: 0.62rem; padding: 1px 5px; }
.band .good { box-shadow: inset 0 -4px 0 var(--good); }
.band .bad { box-shadow: inset 0 -4px 0 var(--warn); }
.now-card.good .big-glyph { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.now-card.bad .big-glyph { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.now-card .main .chip { font-family: var(--font-body); font-size: 0.65rem; vertical-align: middle; }
@media (max-width: 520px) { tr.cur td.n + td { box-shadow: inset 3px 0 0 var(--now); } tr.good td.n + td { box-shadow: inset 3px 0 0 var(--good); } tr.bad td.n + td { box-shadow: inset 3px 0 0 var(--warn); } tr.cur.good td.n + td, tr.cur.bad td.n + td { box-shadow: inset 3px 0 0 var(--now); } }
.good-panel .panch-head h2 { color: var(--good); }
.good-list { display: grid; }
.good-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 18px; border-top: 1px solid var(--line); }
.good-item .when { font: 600 1rem var(--font-mono); color: var(--good); }
.good-item.now { background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.good-item .lordname { color: var(--ink); }
.good-item .meta { margin-left: auto; }
.good-rule { padding: 10px 18px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; line-height: 1.6; }
.good-rule .need { color: var(--accent); }
/* Good-time bars over the day/night band */
.band-wrap { --bh: 34px; position: relative; padding-top: 12px; }
.band-wrap .band { --band-h: var(--bh); }
.gtrack { position: absolute; left: 0; right: 0; top: 0; height: calc(12px + var(--bh) + 2px); pointer-events: none; }
.gbar {
  position: absolute; top: 0; bottom: 0; min-width: 5px; padding: 0; margin: 0; cursor: pointer; pointer-events: auto;
  background: color-mix(in srgb, var(--good) 45%, transparent);
  border: 0; border-top: 9px solid var(--good); border-radius: 3px 3px 0 0;
}
.gbar:hover, .gbar.on { background: color-mix(in srgb, var(--good) 65%, transparent); }
.gbar:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.gtip {
  position: absolute; top: calc(var(--bh) + 22px); z-index: 5; width: max-content; max-width: min(320px, 100%);
  background: var(--surface); color: var(--ink); border: 1px solid var(--good); border-radius: 8px;
  padding: 10px 12px; font-size: 0.86rem; line-height: 1.6; box-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
}
.gtip .t { font: 600 0.95rem var(--font-mono); color: var(--good); }
.gtip .fx { margin-top: 4px; font-size: 0.82rem; }
/* Current time on the day/night band */
.nowline { position: absolute; top: 2px; height: calc(10px + var(--bh) + 8px); width: 2px; margin-left: -1px; z-index: 3; pointer-events: none;
  background: #ffffff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.55); border-radius: 1px; }
.nowline::before { content: ""; position: absolute; top: -2px; left: -4px; border: 5px solid transparent; border-top: 7px solid #ffffff; }
/* Start time under each hora on wider screens */
.band .bt { display: none; font: 500 0.6rem var(--font-mono); opacity: 0.85; letter-spacing: -0.02em; white-space: nowrap; }
@media (min-width: 700px) {
  .band-wrap { --bh: 50px; }
  .band .bt { display: block; }
  .band div { font-size: 0.8rem; }
}
/* Phone turned sideways: band first, taller and easier to read */
/* html.land-phone is set from the device's real orientation, which also works when the Claude app stretches the page to full height */
html.land-phone header.top { order: -2; }
html.land-phone .band-wrap { order: -1; --bh: 64px; }
html.land-phone .band .bt { display: block; font-size: 0.66rem; }
html.land-phone .band div, html.land-phone[lang="te"] .band div { font-size: 0.95rem; }
</style>

<div class="wrap">
  <header class="top">
    <h1 data-i18n="title">హోర చక్రం</h1>
    <select id="lang" class="lang" aria-label="Language / భాష">
      <option value="te">తెలుగు</option>
      <option value="en">English</option>
    </select>
  </header>

  <form class="panel" id="form" autocomplete="off">
    <div class="fields">
      <div class="field">
        <label for="date" data-i18n="date">తేదీ</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="city" data-i18n="town">మీ ఊరు</label>
        <select id="city"></select>
        <small id="cityNote"></small>
      </div>
      <div class="field wide">
        <label for="offset" data-i18n="offset">రాజమండ్రి నుండి దేశాంతరం (ని॥)</label>
        <div class="offset-row">
          <input type="number" id="offset" step="1" inputmode="numeric" required>
          <button type="button" id="apply" data-i18n="recalc" disabled>మళ్ళీ లెక్కించు</button>
        </div>
        <small id="offNote"></small>

<script>
// Surya Siddhanta panchangam engine (tuned to the reference almanac)
const PJ = (() => {
  const R = Math.PI / 180, frac = (x) => x - Math.floor(x), norm = (x) => ((x % 360) + 360) % 360;
  // Surya Siddhanta: revolutions per Mahayuga and civil days
  const CIVIL = 1577917828, SUN_REV = 4320000, MOON_REV = 57753336, MOON_APO_REV = 488203;
  const SUN_APO = 77.26 - 2.21094;  // Sun's mandocca (fitted)
  const UJJAIN = 75.77;            // Kali epoch is midnight at Ujjain
  // Fitted corrections (Rajahmundry), 30 Oct 2026 - 7 Apr 2027 (rms 2.5 min)
  const MOON_FIX = -0.03959, SUN_FIX = -0.04745, MOON_EPI = 1 - 0.00367, SUN_EPI = 1 - 0.00288;
  const MOON_APO_FIX = -0.2627, EOT_K = 0.60053, SHIFT_MIN = -0.8948;
  // Equation of time in minutes (apparent minus mean solar time)
  function eot(ms) {
    const n = ms / 86400000 + 2440587.5 - 2451545;
    const L = norm(280.460 + 0.9856474 * n), g = norm(357.528 + 0.9856003 * n) * R;
    const lam = (L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * R, eps = 23.439 * R;
    let e = L - norm(Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) / R);
    if (e > 180) e -= 360; if (e < -180) e += 360;
    return 4 * e;
  }
  // The almanac treats its computed moments as local apparent time, so shift by the equation of time
  const ahargana = (ms) => { const t = ms + (EOT_K * eot(ms) + SHIFT_MIN) * 60000; return t / 86400000 + 2440587.5 - (588465.5 - UJJAIN / 360); };
  function manda(mean, apo, pEven, pOdd) {
    const k = (mean - apo) * R;
    const p = pEven - (pEven - pOdd) * Math.abs(Math.sin(k));
    return mean - Math.asin((p / 360) * Math.sin(k)) / R;
  }
  function longitudes(ms) {
    const A = ahargana(ms);
    const sunMean = 360 * frac((SUN_REV * A) / CIVIL);
    const moonMean = 360 * frac((MOON_REV * A) / CIVIL) + MOON_FIX;
    const moonApo = norm(90 + 360 * frac((MOON_APO_REV * A) / CIVIL) + MOON_APO_FIX);
    return {
      sun: norm(manda(sunMean, SUN_APO, 14 * SUN_EPI, (13 + 2 / 3) * SUN_EPI) + SUN_FIX),
      moon: norm(manda(moonMean, moonApo, 32 * MOON_EPI, (31 + 2 / 3) * MOON_EPI)),
    };
  }
  const tithiPos = (ms) => { const l = longitudes(ms); return norm(l.moon - l.sun) / 12; };
  const nakPos = (ms) => longitudes(ms).moon / (360 / 27);

  // Walk forward from t0 to t1 and return [{index, start, end}] segments
  function segments(fn, t0, t1, count) {
    const out = [];
    let cur = Math.floor(fn(t0)) % count;
    let segStart = findStart(fn, t0, cur, count);
    let t = t0;
    const step = 3600000;
    while (t < t1) {
      const t2 = t + step;
      const v = Math.floor(fn(t2)) % count;
      if (v !== cur) {
        let a = t, b = t2;
        for (let i = 0; i < 32; i++) { const m = (a + b) / 2; if (Math.floor(fn(m)) % count === cur) a = m; else b = m; }
        out.push({ index: cur, start: segStart, end: b });
        segStart = b; cur = v;
      }
      t = t2;
    }
    // close the last open segment
    let t3 = t; while (Math.floor(fn(t3)) % count === cur) t3 += step;
    let a = t3 - step, b = t3;
    for (let i = 0; i < 32; i++) { const m = (a + b) / 2; if (Math.floor(fn(m)) % count === cur) a = m; else b = m; }
    out.push({ index: cur, start: segStart, end: b });
    return out;
  }
  function findStart(fn, t0, cur, count) {
    let t = t0; const step = 3600000;
    while (Math.floor(fn(t - step)) % count === cur) t -= step;
    let a = t - step, b = t;
    for (let i = 0; i < 32; i++) { const m = (a + b) / 2; if (Math.floor(fn(m)) % count === cur) b = m; else a = m; }
    return b;
  }

  // Sunrise/sunset: Sun's centre on the horizon, no refraction (traditional definition)
  function sunEvents(y, m, d, lat, lon, tzMin) {
    const calc = (rising) => {
      let t = Date.UTC(y, m - 1, d, 12) - lon / 15 * 3600000; // local noon guess
      for (let i = 0; i < 4; i++) {
        const jd = t / 86400000 + 2440587.5, n = jd - 2451545.0;
        const L = norm(280.460 + 0.9856474 * n), g = norm(357.528 + 0.9856003 * n) * R;
        const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * R;
        const eps = (23.439 - 0.0000004 * n) * R;
        const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
        const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) / R;
        const eot = 4 * (L - norm(ra) - (L - norm(ra) > 180 ? 360 : 0) + (L - norm(ra) < -180 ? 360 : 0)); // minutes
        const cosH = -Math.tan(lat * R) * Math.tan(dec);
        const H = Math.acos(Math.max(-1, Math.min(1, cosH))) / R;
        const noonUT = 720 - 4 * lon - eot; // minutes from 0h UT
        const evMin = noonUT + (rising ? -4 * H : 4 * H);
        t = Date.UTC(y, m - 1, d) + evMin * 60000;
      }
      return t;
    };
    return { rise: calc(true), set: calc(false) };
  }

  // Varjyam: start ghati (of 60) from nakshatra start, lasts 4 ghatis; scaled to the nakshatra's real length
  const VARJYAM = [50, 24, 30, 40, 14, 21, 30, 20, 32, 30, 20, 18, 21, 20, 14, 14, 10, 14, 20, 24, 20, 10, 10, 18, 16, 24, 30];
  // Moola has a second Varjyam at 56 ghatis
  function varjyam(seg) {
    const gh = (seg.end - seg.start) / 60;
    const starts = seg.index === 18 ? [VARJYAM[18], 56] : [VARJYAM[seg.index]];
    return starts.map((g) => ({ start: seg.start + g * gh, end: seg.start + (g + 4) * gh, nak: seg.index }));
  }

  // Durmuhurtham: day/night each split into 15 muhurtas. [weekday] -> list of {night?, n}
  const DUR = [
    [{ n: 14 }], [{ n: 9 }, { n: 12 }], [{ n: 4 }, { night: true, n: 7 }], [{ n: 8 }],
    [{ n: 6 }, { n: 12 }], [{ n: 4 }, { n: 9 }], [{ n: 1, len: 2 }],
  ];
  function durmuhurtham(wd, rise, set, nextRise) {
    const dm = (set - rise) / 15, nm = (nextRise - set) / 15;
    return DUR[wd].map((x) => x.night
      ? { start: set + (x.n - 1) * nm, end: set + x.n * nm, night: true }
      : { start: rise + (x.n - 1) * dm, end: rise + (x.n - 1 + (x.len || 1)) * dm });
  }

  return { longitudes, tithiPos, nakPos, segments, sunEvents, varjyam, durmuhurtham };
})();
if (typeof module !== "undefined") module.exports = PJ;

</script>

    localStorage.setItem("hora-inputs", JSON.stringify({ adjAll: $("adjAll").checked }));
    localStorage.setItem("hora-lang", LANG);
    localStorage.setItem("hora-janma", String(janma));
  } catch (e) {}
}

function selectedDate() {
  const v = $("date").value; if (!v) return null;
  const [Y, M, D] = v.split("-").map(Number); return { Y, M, D };
}
function fillSun() {
  const d = selectedDate(); if (!d) return;
  const ev = PJ.sunEvents(d.Y, d.M, d.D, REF.lat, REF.lon);
  const base = istMidnight(d.Y, d.M, d.D);
  if (!manual.sunrise) $("sunrise").value = hhmm((ev.rise - base) / 60000);
  if (!manual.sunset) $("sunset").value = hhmm((ev.set - base) / 60000);
  markManual();
}
function markManual() {
  $("sunrise").classList.toggle("edited", manual.sunrise);
  $("sunset").classList.toggle("edited", manual.sunset);
  $("srNote").textContent = manual.sunrise ? L().entered : L().calc;
  $("ssNote").textContent = manual.sunset ? L().entered : L().calc;
  $("recalc").hidden = !(manual.sunrise || manual.sunset);
}

// minutes from selected date's IST midnight -> display parts
function fmt(mins, withSec) {
  const totalSec = withSec ? Math.round(mins * 60) : Math.round(mins) * 60;
  const dayShift = Math.floor(totalSec / 86400);
  const s = ((totalSec % 86400) + 86400) % 86400;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const h12 = ((h + 11) % 12) + 1, ap = h < 12 ? "AM" : "PM";
  return { hm: `${pad(h12)}:${pad(m)}`, sec: pad(sec), ap, shift: dayShift, mod: s / 60, te: `${h12}.${pad(m)}` };
}
// Telugu almanac style: తె. before sunrise, ఉ. morning, ప. afternoon, సా. evening, రా. night
let TE_SUNRISE = 375;
function tePre(mod) {
  if (mod < 180) return "రా.";
  if (mod < TE_SUNRISE) return "తె.";
  if (mod < 720) return "ఉ.";
  if (mod < 960) return "ప.";
  if (mod < 1140) return "సా.";
  return "రా.";
}
// "+1" only for times past the next sunrise (a time before it belongs to the same Hindu day)
const teShift = (f) => (f.shift > 0 && f.mod >= TE_SUNRISE) || f.shift > 1 ? ` <span class="plus">(+${f.shift})</span>` : f.shift < 0 ? ` <span class="plus">(${f.shift})</span>` : "";
const isTe = () => LANG === "te";
function rangeHTML(a, b, bare) {
  if (!isTe()) return bare ? `${bareTime(a)} – ${bareTime(b)}` : `${shortHTML(a)} – ${shortHTML(b)}`;
  const fa = fmt(a, false), fb = fmt(b, false), pa = tePre(fa.mod), pb = tePre(fb.mod);
  return `${pa}\u00a0${fa.te}${bare ? "" : teShift(fa)} ల ${fb.te}${bare ? "" : teShift(fb)}`;
}
const shiftHTML = (f) => f.shift > 0 ? ` <span class="plus">(+${f.shift})</span>` : f.shift < 0 ? ` <span class="plus">(${f.shift})</span>` : "";
function timeHTML(mins) { const f = fmt(mins, true); return isTe() ? `${tePre(f.mod)}\u00a0${f.te}<span class="s">:${f.sec}</span>${teShift(f)}` : `${f.hm}<span class="s">:${f.sec}</span> <span class="s">${f.ap}</span>${shiftHTML(f)}`; }
function shortHTML(mins) { const f = fmt(mins, false); return isTe() ? `${tePre(f.mod)}\u00a0${f.te}${teShift(f)}` : `${f.hm} ${f.ap}${shiftHTML(f)}`; }
const teShiftText = (f) => (f.shift > 0 && f.mod >= TE_SUNRISE) || f.shift > 1 ? `\u00a0(+${f.shift})` : "";
function plain(mins) { const f = fmt(mins, true); return isTe() ? `${tePre(f.mod)}\u00a0${f.te}:${f.sec}${teShiftText(f)}` : `${f.hm}:${f.sec} ${f.ap}${f.shift > 0 ? " (+1)" : ""}`; }
function plainShort(mins) { const f = fmt(mins, false); return isTe() ? `${tePre(f.mod)}\u00a0${f.te}${teShiftText(f)}` : `${f.hm} ${f.ap}${f.shift > 0 ? " (+1)" : ""}`; }
const bandTime = (mins) => { const f = fmt(mins, false); return isTe() ? f.te : f.hm.replace(/^0/, ""); };
const bareTime = (mins) => { const f = fmt(mins, false); return isTe() ? `${tePre(f.mod)}\u00a0${f.te}` : `${f.hm} ${f.ap}`; };
function dur(mins) { const s = Math.round(mins * 60); return L().ms(Math.floor(s / 60), pad(s % 60)); }

function compute() {
  const d = selectedDate(), sr = $("sunrise").value, ss = $("sunset").value;
  const off = -appliedOffset; // minutes added to Rajahmundry times
  if (!d || !sr || !ss || isNaN(off)) return { error: L().errFill };
  const sunrise = toMin(sr), sunset = toMin(ss);
  if (sunset <= sunrise) return { error: L().errSet };
  const dayLen = sunset - sunrise, nightLen = 1440 - dayLen;
  const dayHora = dayLen / 12, nightHora = nightLen / 12;
  const wd = new Date(Date.UTC(d.Y, d.M - 1, d.D)).getUTCDay();
  const startIdx = VARA_START[wd];
  const horas = [];
  for (let i = 0; i < 24; i++) {
    const isDay = i < 12;
    const start = isDay ? sunrise + off + i * dayHora : sunset + off + (i - 12) * nightHora;
    const len = isDay ? dayHora : nightHora;
    horas.push({ i, isDay, start, end: start + len, lord: LORDS[(startIdx + i) % 7] });
  }
  return { ...d, wd, sunrise, sunset, off, dayHora, nightHora, dayLen, nightLen, horas, base: istMidnight(d.Y, d.M, d.D) };
}

// Book convention: list what ends before the next sunrise; if nothing ends, the running one is "purti" (all day)
function bookList(segs, dayEndMs) {
  const ending = segs.filter((s) => s.end < dayEndMs);
  return ending.length ? ending.map((s) => ({ s, purti: false })) : [{ s: segs[0], purti: true }];
}
function bookSpan(x, toLocal) {
  return x.purti ? `<span class="when">${L().purti}</span>` : L().till(shortHTML(toLocal(x.s.end)));
}

function panchangam(r) {
  const riseRef = r.base + r.sunrise * 60000;            // reference (unadjusted) sunrise
  const nextRiseRef = riseRef + 1440 * 60000;
  const shift = $("adjAll").checked ? r.off : 0;
  const toLocal = (ms) => (ms - r.base) / 60000 + shift;
  const fromRise = r.sunrise, toRise = r.sunrise + 1440;  // reference day window, minutes
  const live = [];

  const tithis = PJ.segments(PJ.tithiPos, riseRef, nextRiseRef, 30);
  const naks = PJ.segments(PJ.nakPos, riseRef, nextRiseRef, 27);
  $("pTithi").innerHTML = bookList(tithis, nextRiseRef).map((x) => `<div class="item"><span class="name">${tithiName(x.s.index)}</span>${bookSpan(x, toLocal)}</div>`).join("");
  $("pNak").innerHTML = bookList(naks, nextRiseRef).map((x) => `<div class="item"><span class="name">${nakName(x.s.index)}</span>${bookSpan(x, toLocal)}</div>`).join("");

  // Varjyam periods that start between this sunrise and the next (also check the nakshatra that follows)
  const nakList = naks.slice();
  const last = nakList[nakList.length - 1];
  nakList.push(...PJ.segments(PJ.nakPos, last.end + 60000, last.end + 120000, 27));
  const now = (Date.now() - r.base) / 60000;
  const varj = nakList.flatMap(PJ.varjyam).filter((v) => { const m = (v.start - r.base) / 60000; return m >= fromRise && m < toRise; });
  $("pVarj").innerHTML = varj.length ? varj.map((v) => {
    const a = toLocal(v.start), b = toLocal(v.end), isLive = now >= a && now < b;
    if (isLive) live.push(L().varj);
    return `<div class="item"><span class="when">${rangeHTML(a, b)}</span><span class="te">${nakName(v.nak)}</span>${isLive ? `<span class="chip live">${L().now}</span>` : ""}</div>`;
  }).join("") : `<div class="item empty">${L().noVarj}</div>`;

  // Durmuhurtham uses the adjusted sunrise/sunset, like the horas
  const rise = r.base + (r.sunrise + r.off) * 60000, set = r.base + (r.sunset + r.off) * 60000;
  const dm = PJ.durmuhurtham(r.wd, rise, set, rise + 1440 * 60000);
  $("pDur").innerHTML = dm.map((x) => {
    const a = (x.start - r.base) / 60000, b = (x.end - r.base) / 60000, isLive = now >= a && now < b;
    if (isLive) live.push(L().dur);
    return `<div class="item"><span class="when">${rangeHTML(a, b)}</span>${x.night && !isTe() ? `<span class="te">${L().night}</span>` : ""}${isLive ? `<span class="chip avoid">${L().now}</span>` : ""}</div>`;
  }).join("");

  $("panchRange").textContent = L().range(plainShort(r.sunrise + r.off), plainShort(r.sunrise + r.off + 1440));
  return live;
}

function rowHTML(h, cur) {
  return `<tr class="${cur ? "cur" : ""} ${qual(h.lord)}">
    <td class="n">${h.isDay ? h.i + 1 : h.i - 11}</td>
    <td><span class="lord"><span class="glyph">${abbr(h.lord)}</span><b>${lordName(h.lord)}</b>${LANG === "en" ? `<em>${h.lord.e}</em>` : ""}${cur ? `<span class="tag">${L().now}</span>` : ""}</span></td>
    <td class="t">${timeHTML(h.start)}</td>
    <td class="t">${timeHTML(h.end)}</td>
  </tr>`;
}
const head = () => `<thead><tr><th>#</th><th>${L().lordH}</th><th>${L().starts}</th><th>${L().ends}</th></tr></thead>`;

function render() {
  const r = compute();
  const msg = $("msg");
  if (r.error) { msg.textContent = r.error; msg.hidden = false; return; }
  msg.hidden = true;
  save();

  TE_SUNRISE = r.sunrise + r.off;
  const now = (Date.now() - r.base) / 60000;
  const curIdx = r.horas.findIndex((h) => now >= h.start && now < h.end);
  $("vara").innerHTML = L().vara(VARA[LANG][r.wd], lordName(r.horas[0].lord));

  let live = [];
  try { live = panchangam(r); } catch (e) { console.error(e); }
  try { renderTara(r); } catch (e) { console.error(e); }
  try { renderDays(); } catch (e) { console.error(e); }

  const cur = curIdx >= 0 ? r.horas[curIdx] : null;
  const card = $("nowCard");
  if (cur) {
    const nx = r.horas[curIdx + 1];
    card.className = "now-card " + qual(cur.lord);
    card.innerHTML = `<div class="big-glyph" aria-hidden="true">${abbr(cur.lord)}</div>
      <div class="lbl">${L().cardLbl(cur.isDay, cur.isDay ? cur.i + 1 : cur.i - 11)}</div>
      <div class="main">${lordName(cur.lord)} ${qualChip(cur.lord)} <span class="when">${rangeHTML(cur.start, cur.end)}</span></div>
      <div class="sub">${nx ? `<span>${L().next(lordName(nx.lord), shortHTML(nx.start))}</span>` : ""}${live.length ? `<span class="warn">${L().liveIn(live)}</span>` : ""}</div>
      <div class="effect">${HORA_FX[LANG][LORDS.indexOf(cur.lord)]}</div>`;
    card.hidden = false;
  }
  // Before sunrise the current hora belongs to the previous day's chart
  const prev = cur ? null : prevChartNow(r);
  if (!cur) {
    if (prev) {
      card.className = "now-card " + qual(prev.h.lord);
      card.innerHTML = `<div class="big-glyph" aria-hidden="true">${abbr(prev.h.lord)}</div>
        <div class="lbl">${L().cardPrev(prev.h.i - 11)}</div>
        <div class="main">${lordName(prev.h.lord)} ${qualChip(prev.h.lord)} <span class="when">${rangeHTML(prev.h.start, prev.h.end, true)}</span></div>
        <div class="sub">${prev.nx ? `<span>${L().next(lordName(prev.nx.lord), bareTime(prev.nx.start))}</span>` : `<span>${L().todayFrom(shortHTML(r.horas[0].start))}</span>`}</div>
        <div class="effect">${HORA_FX[LANG][LORDS.indexOf(prev.h.lord)]}</div>`;
      card.hidden = false;
    } else card.hidden = true;
  }
  let goodNow = false;
  try { goodNow = renderGood(r); } catch (e) { console.error(e); }
  if (goodNow && !card.hidden) { const sub = card.querySelector(".sub"); if (sub) sub.insertAdjacentHTML("afterbegin", `<span class="chip good">${L().goodNow}</span>`); }
  $("stats").innerHTML = `
    <div class="stat"><span>${L().dayLen}</span><b>${L().hm(Math.floor(r.dayLen / 60), pad(r.dayLen % 60))}</b></div>
    <div class="stat"><span>${L().dayHora}</span><b>${dur(r.dayHora)}</b></div>
    <div class="stat"><span>${L().nightHora}</span><b>${dur(r.nightHora)}</b></div>
    <div class="stat now"><span>${L().curHora}</span><b>${cur ? L().curTill(lordName(cur.lord), bareTime(cur.end)) : prev ? L().curTill(lordName(prev.h.lord), bareTime(prev.h.end)) : L().notIn}</b></div>`;

  $("band").innerHTML = r.horas.map((h, i) =>
    `<div class="${h.isDay ? "d" : "n"} ${qual(h.lord)}${i === curIdx ? " cur" : ""}" title="${lordName(h.lord)}: ${plain(h.start)} – ${plain(h.end)}"><span>${abbr(h.lord)}</span><span class="bt">${bandTime(h.start)}</span></div>`
  ).join("");
  // Vertical line at the current time (system clock), placed within its hora's segment
  const nl = $("nowLine");
  if (curIdx >= 0) {
    const hc = r.horas[curIdx];
    nl.style.left = ((curIdx + (now - hc.start) / (hc.end - hc.start)) * 100 / 24) + "%";
    nl.hidden = false;
  } else nl.hidden = true;
  $("bandLegend").innerHTML = `<span>${plainShort(r.horas[0].start)}</span><span>${plainShort(r.horas[12].start)}</span><span>${plainShort(r.horas[23].end)}</span>`;

  $("dayRange").textContent = `${plain(r.horas[0].start)} – ${plain(r.horas[11].end)}`;
  $("nightRange").textContent = `${plain(r.horas[12].start)} – ${plain(r.horas[23].end)}`;
  $("dayTbl").innerHTML = head() + "<tbody>" + r.horas.slice(0, 12).map((h) => rowHTML(h, h.i === curIdx)).join("") + "</tbody>";
  $("nightTbl").innerHTML = head() + "<tbody>" + r.horas.slice(12).map((h) => rowHTML(h, h.i === curIdx)).join("") + "</tbody>";
}

// ---------- Good times: good hora lord, no Durmuhurtham/Varjyam, good tara ----------
const GOOD_HORA = [1, 2, 3, 5];          // Sukra, Budha, Chandra, Guru (index into LORDS)
const GOOD_TARA = [1, 3, 5, 7, 8];       // taras 2, 4, 6, 8, 9 (0-based)
// Tithis 2, 3, 5, 7, 10, 11, 13 of both pakshas, Shukla Chaturdashi, Purnima, Bahula Padyami (0 = Shukla Padyami)
const GOOD_TITHI = [1, 2, 4, 6, 9, 10, 12, 13, 14, 15, 16, 17, 19, 21, 24, 25, 27];
function goodWindows(r) {
  const riseRef = r.base + r.sunrise * 60000, nextRiseRef = riseRef + 1440 * 60000;
  const shift = $("adjAll").checked ? r.off : 0;
  const toLocal = (ms) => (ms - r.base) / 60000 + shift;
  const naks = PJ.segments(PJ.nakPos, riseRef, nextRiseRef, 27);
  const last = naks[naks.length - 1];
  const more = naks.concat(PJ.segments(PJ.nakPos, last.end + 60000, last.end + 120000, 27));
  const bad = more.flatMap(PJ.varjyam).map((v) => [toLocal(v.start), toLocal(v.end)]);
  const rise = r.base + (r.sunrise + r.off) * 60000, set = r.base + (r.sunset + r.off) * 60000;
  PJ.durmuhurtham(r.wd, rise, set, rise + 1440 * 60000).forEach((x) => bad.push([(x.start - r.base) / 60000, (x.end - r.base) / 60000]));
  if (janma >= 0) naks.forEach((s) => { if (!GOOD_TARA.includes(taraOf(s.index).t)) bad.push([toLocal(s.start), toLocal(s.end)]); });
  const tithis = PJ.segments(PJ.tithiPos, riseRef, nextRiseRef, 30);
  tithis.forEach((s) => { if (!GOOD_TITHI.includes(s.index)) bad.push([toLocal(s.start), toLocal(s.end)]); });
  const out = [];
  r.horas.forEach((hr) => {
    if (!GOOD_HORA.includes(LORDS.indexOf(hr.lord))) return;
    let segs = [[hr.start, hr.end]];
    bad.forEach(([a, b]) => {
      segs = segs.flatMap(([s, e]) => (b <= s || a >= e) ? [[s, e]] : [...(a > s ? [[s, a]] : []), ...(b < e ? [[b, e]] : [])]);
    });
    segs.filter(([s, e]) => e - s >= 5).forEach(([s, e]) => {
      const mid = (s + e) / 2, nk = naks.find((x) => toLocal(x.start) <= mid && mid < toLocal(x.end));
      const tt = tithis.find((x) => toLocal(x.start) <= mid && mid < toLocal(x.end));
      out.push({ s, e, lord: hr.lord, i: hr.i, nak: nk ? nk.index : null, tithi: tt ? tt.index : null });
    });
  });
  return out;
}
function tipHTML(w, r) {
  const hr = r.horas[w.i], t = w.nak !== null && janma >= 0 ? taraOf(w.nak).t : null;
  return `<div class="t">${rangeHTML(w.s, w.e)} · ${L().minsF(w.e - w.s)}</div>
    <div>${L().horaL}: <b>${lordName(w.lord)}</b> (${L().horaNo(hr.isDay, hr.isDay ? hr.i + 1 : hr.i - 11)})</div>
    ${w.tithi !== null ? `<div>${L().tithi}: <b>${tithiName(w.tithi)}</b></div>` : ""}
    ${w.nak !== null ? `<div>${L().nak}: <b>${nakName(w.nak)}</b>${t !== null ? ` · ${L().taraL}: <b>${TARA_NAME[LANG][t]} (${t + 1})</b>` : ""}</div>` : ""}
    <div>${L().clean}</div>
    <div class="fx">${HORA_FX[LANG][LORDS.indexOf(w.lord)]}</div>`;
}
let pinnedBar = null;
function showTip(bar) {
  const tip = $("gtip"), wrap = $("bandWrap");
  tip.innerHTML = bar.dataset.tip;
  tip.hidden = false;
  const wr = wrap.getBoundingClientRect(), br = bar.getBoundingClientRect();
  const tw = tip.offsetWidth, centre = br.left - wr.left + br.width / 2;
  tip.style.left = Math.max(0, Math.min(wr.width - tw, centre - tw / 2)) + "px";
  document.querySelectorAll(".gbar.on").forEach((b) => b.classList.remove("on"));
  bar.classList.add("on");
}
function hideTip() {
  $("gtip").hidden = true;
  document.querySelectorAll(".gbar.on").forEach((b) => b.classList.remove("on"));
  pinnedBar = null;
}
let barsKey = "";
function renderBars(list, r) {
  // Rebuild only when the windows change, so an open tooltip survives the 30-second refresh
  const key = [LANG, janma, r.base, list.map((w) => w.s.toFixed(2) + "-" + w.e.toFixed(2)).join(",")].join("|");
  if (key === barsKey) return;
  barsKey = key;
  const W = 100 / 24;
  $("gtrack").innerHTML = list.map((w, k) => {
    const hr = r.horas[w.i], len = hr.end - hr.start;
    const left = (w.i + (w.s - hr.start) / len) * W, width = ((w.e - w.s) / len) * W;
    return `<button type="button" class="gbar" data-k="${k}" style="left:${left}%;width:${width}%" aria-label="${L().goodTitle} ${plainShort(w.s)} – ${plainShort(w.e)}"></button>`;
  }).join("");
  $("gtrack").querySelectorAll(".gbar").forEach((b) => {
    const w = list[+b.dataset.k];
    b.dataset.tip = tipHTML(w, r);
    b.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") showTip(b); });
    b.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && pinnedBar !== b) hideTip(); });
    b.addEventListener("focus", () => showTip(b));
    b.addEventListener("blur", () => { if (pinnedBar !== b) hideTip(); });
    b.addEventListener("click", (e) => { e.stopPropagation(); if (pinnedBar === b) { hideTip(); } else { showTip(b); pinnedBar = b; } });
  });
  hideTip();
}
document.addEventListener("click", (e) => { if (pinnedBar && !e.target.closest(".gtip")) hideTip(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });

function renderGood(r) {
  const list = goodWindows(r), now = (Date.now() - r.base) / 60000;
  renderBars(list, r);
  return list.some((w) => now >= w.s && now < w.e);
}

// ---------- Next 10 days (calculated sunrise/sunset, current town offset) ----------
function dayInfoHTML(Y, M, D, isToday) {
  const base = istMidnight(Y, M, D), ev = PJ.sunEvents(Y, M, D, REF.lat, REF.lon);
  const sr = Math.round((ev.rise - base) / 60000), ss = Math.round((ev.set - base) / 60000);
  const off = -appliedOffset, shift = $("adjAll").checked ? off : 0;
  const keepSunrise = TE_SUNRISE; TE_SUNRISE = sr + off;
  const riseRef = base + sr * 60000, nextRef = riseRef + 1440 * 60000;
  const toLocal = (ms) => (ms - base) / 60000 + shift;
  const wd = new Date(Date.UTC(Y, M - 1, D)).getUTCDay();
  const tithis = PJ.segments(PJ.tithiPos, riseRef, nextRef, 30);
  const naks = PJ.segments(PJ.nakPos, riseRef, nextRef, 27);
  const more = naks.concat(PJ.segments(PJ.nakPos, naks[naks.length - 1].end + 60000, naks[naks.length - 1].end + 120000, 27));
  const varj = more.flatMap(PJ.varjyam).filter((v) => { const m = (v.start - base) / 60000; return m >= sr && m < sr + 1440; });
  const rise = base + (sr + off) * 60000, set = base + (ss + off) * 60000;
  const dm = PJ.durmuhurtham(wd, rise, set, rise + 1440 * 60000);
  const row = (k, items) => `<div class="day-row"><span class="k">${k}</span><span class="v">${items.join("")}</span></div>`;
  const html = `<div class="day${isToday ? " today" : ""}">
    <div class="day-head"><b>${pad(D)}/${pad(M)} · ${L().varaS[wd]}${isToday ? ` · ${L().today}` : ""}</b>
      <span class="sun">${isTe() ? `సూ.ఉ.\u00a0${fmt(sr + off).te} · సూ.అ.\u00a0${fmt(ss + off).te}` : `${L().srS} ${bareTime(sr + off)} · ${L().ssS} ${bareTime(ss + off)}`}</span></div>
    ${row(L().tithi, bookList(tithis, nextRef).map((x) => `<span>${tithiName(x.s.index)} ${bookSpan(x, toLocal)}</span>`))}
    ${row(L().nak, bookList(naks, nextRef).map((x) => `<span>${nakName(x.s.index)} ${bookSpan(x, toLocal)}</span>`))}
    ${row(L().varj, varj.length ? varj.map((v) => `<span><span class="when">${rangeHTML(toLocal(v.start), toLocal(v.end))}</span></span>`) : [`<span class="meta">${L().noVarj}</span>`])}
    ${row(L().dur, dm.map((x) => `<span><span class="when">${rangeHTML((x.start - base) / 60000, (x.end - base) / 60000)}</span>${x.night && !isTe() ? ` <span class="meta">${L().night}</span>` : ""}</span>`))}
  </div>`;
  TE_SUNRISE = keepSunrise;
  return html;
}
let daysKey = "";
function renderDays() {
  if (!$("daysRef").open) return;
  const t = systemDate();
  const key = [isoDate(t), appliedOffset, $("adjAll").checked, LANG].join("|");
  if (key === daysKey) return;
  daysKey = key;
  let html = "";
  for (let i = 0; i < 10; i++) {
    const d = new Date(Date.UTC(t.Y, t.M - 1, t.D + i));
    html += dayInfoHTML(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), i === 0);
  }
  $("daysBody").innerHTML = html;
}

// Horas of the day before the selected date, from calculated sunrise/sunset, for the pre-sunrise "now" card
function prevChartNow(r) {
  const d = new Date(Date.UTC(r.Y, r.M - 1, r.D - 1));
  const Y = d.getUTCFullYear(), M = d.getUTCMonth() + 1, D = d.getUTCDate();
  const base = istMidnight(Y, M, D), ev = PJ.sunEvents(Y, M, D, REF.lat, REF.lon);
  const sr = Math.round((ev.rise - base) / 60000), ss = Math.round((ev.set - base) / 60000), off = -appliedOffset;
  const night = (1440 - (ss - sr)) / 12, now = (Date.now() - base) / 60000;
  const start0 = VARA_START[new Date(Date.UTC(Y, M - 1, D)).getUTCDay()];
  for (let i = 12; i < 24; i++) {
    const s = ss + off + (i - 12) * night, e = s + night;
    if (now >= s && now < e) {
      const mk = (k, st) => ({ i: k, start: st, end: st + night, lord: LORDS[(start0 + k) % 7] });
      return { h: mk(i, s), nx: i < 23 ? mk(i + 1, e) : null };
    }
  }
  return null;
}
const systemDate = () => { const d = new Date(); return { Y: d.getFullYear(), M: d.getMonth() + 1, D: d.getDate() }; };

// A Hindu day runs sunrise to sunrise: before today's first hora, the current hora belongs to yesterday's chart.
function jumpToNow() {
  manual = { sunrise: false, sunset: false };
  $("date").value = isoDate(istParts(Date.now()));
  fillSun();
  const r = compute();
  if (!r.error && (Date.now() - r.base) / 60000 < r.horas[0].start) {
    $("date").value = isoDate(istParts(Date.now() - 86400000));
    fillSun();
  }
  render();
}

// Detect a phone held sideways from the device itself, not the page frame
function updateOrientation() {
  let land = false;
  try {
    const t = screen.orientation && screen.orientation.type;
    if (t) land = t.startsWith("landscape");
    else if (typeof window.orientation === "number") land = Math.abs(window.orientation) === 90;
    else land = window.innerWidth > window.innerHeight;
  } catch (e) {}
  const phone = Math.min(screen.width, screen.height) < 520;
  document.documentElement.classList.toggle("land-phone", land && phone);
}
updateOrientation();
try { screen.orientation && screen.orientation.addEventListener("change", updateOrientation); } catch (e) {}
window.addEventListener("orientationchange", updateOrientation);
window.addEventListener("resize", updateOrientation);

loadPrefs();
// Open on the device's own date
$("date").value = isoDate(systemDate());
fillSun();
render();
$("lang").addEventListener("change", () => { LANG = $("lang").value; applyLang(); render(); });
$("date").addEventListener("input", () => { manual = { sunrise: false, sunset: false }; fillSun(); render(); });
$("sunrise").addEventListener("input", () => { manual.sunrise = true; markManual(); render(); });
$("sunset").addEventListener("input", () => { manual.sunset = true; markManual(); render(); });
$("offset").addEventListener("input", pendingState);
$("offset").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); applyOffset(); } });
$("apply").addEventListener("click", applyOffset);
$("city").addEventListener("change", () => { nearestNote = false; chooseTown(+$("city").value); render(); });
$("adjAll").addEventListener("change", render);
$("janma").addEventListener("change", () => { janma = +$("janma").value; render(); });
$("daysRef").addEventListener("toggle", () => { try { renderDays(); } catch (e) { console.error(e); } });
$("form").addEventListener("submit", (e) => e.preventDefault());
$("recalc").addEventListener("click", () => { manual = { sunrise: false, sunset: false }; fillSun(); render(); });
setInterval(render, 30000);
</script>
